version: '3.9'
services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 app:create_app()
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hindustanyatra
      MYSQL_USER: hindustanyatra
      MYSQL_PASSWORD: hindustanyatra
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mysql_data:
