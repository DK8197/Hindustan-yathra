name: HY backend CI/CD

on:
  pull_request:
    paths:
      - "HY -  Backend/**"
      - ".github/workflows/backend-cloud-run.yml"
  push:
    branches:
      - main
    paths:
      - "HY -  Backend/**"
      - ".github/workflows/backend-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HY -  Backend
    env:
      SQLALCHEMY_DATABASE_URI: sqlite:///:memory:
      SECRET_KEY: ci-only-secret
      JWT_SECRET_KEY: ci-only-jwt-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: HY -  Backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      CLOUDSQL_INSTANCE: ${{ vars.GCP_CLOUDSQL_INSTANCE }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/api:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          for name in PROJECT_ID REGION ARTIFACT_REPOSITORY RUN_SERVICE RUNTIME_SERVICE_ACCOUNT CLOUDSQL_INSTANCE WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions variable for $name"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build and publish immutable image
        run: gcloud builds submit --project "$PROJECT_ID" --region "$REGION" --tag "$IMAGE" "HY -  Backend"

      - name: Deploy Cloud Run revision
        run: >-
          gcloud run deploy "$RUN_SERVICE"
          --project "$PROJECT_ID"
          --region "$REGION"
          --platform managed
          --image "$IMAGE"
          --port 8080
          --service-account "$RUNTIME_SERVICE_ACCOUNT"
          --add-cloudsql-instances "$CLOUDSQL_INSTANCE"
          --allow-unauthenticated
          --min 0
          --max 5
          --concurrency 20
          --set-env-vars "FLASK_ENV=production,UPLOAD_FOLDER=/tmp/hindustanyathra/uploads"
          --set-secrets "API_SECRET=hy-api-secret:1,SECRET_KEY=hy-flask-secret:1,JWT_SECRET_KEY=hy-jwt-secret:1,ADMIN_MOBILE=hy-admin-mobile:1,ADMIN_PASSWORD=hy-admin-password:1,SQLALCHEMY_DATABASE_URI=hy-database-uri:1"